spring.application.name=passenger-service
server.port=8083

printing-service.base-url=${PRINTING_SERVICE_URL:http://localhost:8081}

# How often a "passenger" requests a ticket
passenger.request-interval-ms=${PASSENGER_REQUEST_INTERVAL_MS:2000}

# Expose health/metrics endpoints (Prometheus scrapes /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
