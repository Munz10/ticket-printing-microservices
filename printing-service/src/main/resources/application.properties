spring.application.name=printing-service
server.port=8081

# Initial machine state
machine.toner.initial=60
machine.paper.initial=100

# Resource limits
machine.toner.full=100
machine.paper.full=250
machine.toner.minimum=10
machine.paper.minimum=10
machine.paper.sheets-per-pack=50

# Expose health/metrics endpoints (Prometheus scrapes /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# RabbitMQ - used to publish "resource low" events
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
