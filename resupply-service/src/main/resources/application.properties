spring.application.name=resupply-service
server.port=8082

printing-service.base-url=${PRINTING_SERVICE_URL:http://localhost:8081}

# Expose health/metrics endpoints (Prometheus scrapes /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# RabbitMQ - used to consume "resource low" events from printing-service
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
