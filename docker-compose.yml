services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  printing-service:
    build: ./printing-service
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  resupply-service:
    build: ./resupply-service
    ports:
      - "8082:8082"
    environment:
      PRINTING_SERVICE_URL: http://printing-service:8081
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      printing-service:
        condition: service_started

  passenger-service:
    build: ./passenger-service
    ports:
      - "8083:8083"
    environment:
      PRINTING_SERVICE_URL: http://printing-service:8081
    depends_on:
      printing-service:
        condition: service_started

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - printing-service
      - resupply-service
      - passenger-service
